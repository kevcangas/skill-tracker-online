services:
  postgres:
    image: postgres:16-alpine
    container_name: skill_tracker_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_homelab}
      POSTGRES_DB: ${POSTGRES_DB:-skilltracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skilltracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skill_tracker_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY_URL:-localhost:5000}/skill_tracker_backend:latest
    container_name: skill_tracker_backend
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_homelab}
      POSTGRES_DB: ${POSTGRES_DB:-skilltracker}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_change_in_production_32bytes_min}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,https://skilltracker.homelab.internal,http://skilltracker.homelab.internal,https://api-skilltracker.homelab.internal,http://api-skilltracker.homelab.internal}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skill_tracker_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-skilltracker.homelab.internal}
    image: ${REGISTRY_URL:-localhost:5000}/skill_tracker_frontend:latest
    container_name: skill_tracker_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-skilltracker.homelab.internal}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - skill_tracker_net

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: skill_tracker_backup
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_homelab}
      POSTGRES_DB: ${POSTGRES_DB:-skilltracker}
      POSTGRES_HOST: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skill_tracker_net

volumes:
  postgres_data:
    driver: local
  backup_data:
    driver: local

networks:
  skill_tracker_net:
    driver: bridge
